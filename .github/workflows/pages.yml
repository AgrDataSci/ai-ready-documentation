# Builds the maniva website in English, Spanish, French and Portuguese from site/
# (translations in site/i18n) and the logo files in docs/logo,
# and publishes it to GitHub Pages at https://agrdatasci.github.io/maniva/.
# Pages must be set to "GitHub Actions" in Settings > Pages (one time).

name: pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - tools/build-site.py
      - docs/logo/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the site in every language
        run: |
          python3 tools/build-site.py _site
          mkdir -p _site/logo
          cp docs/logo/*.svg docs/logo/*.png _site/logo/
          cp version.json _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
